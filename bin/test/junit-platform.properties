# Parallel execution for Serenity BDD + JUnit5 Cucumber
# IMPORTANT: Serenity's StepEventBus is ThreadLocal — parallelism must be
# at SCENARIO level (each scenario gets its own thread with its own Serenity context).
# Do NOT set parallelism higher than the number of scenarios to avoid idle threads.

cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=fixed
# Set to the number of scenarios (2); increase if more scenarios are added
cucumber.execution.parallel.config.fixed.parallelism=2
cucumber.execution.parallel.config.fixed.max-pool-size=2
